<link
  href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
  rel="stylesheet"
/>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<div class="container-fluid py-4">
  <!-- ✅ Form to Create User -->
  <div class="card mb-4">
    <div class="card-header">Create User</div>
    <div class="card-body">
      <form action="/user/create" method="POST">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Password</label>
            <input
              type="password"
              name="password"
              class="form-control"
              required
            />
          </div>

          <div class="col-md-4">
            <label class="form-label">Permissions (Views)</label>
            <select
              name="permissions"
              class="form-select select-permissions"
              multiple
              required
            >
              <% views.forEach(function(view) { %>
              <option value="<%= view.name %>"><%= view.name %></option>
              <% }) %>
            </select>
          </div>
        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
  <% if(error){ %>
  <div
    class="alert alert-important alert-danger alert-dismissible"
    role="alert"
  >
    <div class="d-flex">
      <div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="icon icon-tabler icon-tabler-alert-circle"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
          <circle cx="12" cy="12" r="9"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="px-2"><%= error %></div>
    </div>
    <a
      class="btn-close btn-close-white"
      data-bs-dismiss="alert"
      aria-label="close"
    ></a>
  </div>
  <% } %>
  <!-- ✅ Table to Show Users -->
  <div class="card">
    <div class="card-header">Users</div>
    <div class="card-body table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Permissions</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <% users.forEach(function(user) { %>
          <tr>
            <td><%= user.name %></td>
            <td><%= user.permissions %></td>
            <% if (user.name !== 'Admin') { %>
            <td class="w-1 text-center">
              <form
                action="/user/delete/<%= user.id %>"
                method="POST"
                onsubmit="return confirm('Are you sure you want to delete this user?')"
              >
                <button
                  class="btn btn-danger text-center btn-sm w-fit"
                  type="submit"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="icon text-center icon-tabler icon-tabler-trash"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    fill="none"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                    <path d="M4 7l16 0"></path>
                    <path d="M10 11l0 6"></path>
                    <path d="M14 11l0 6"></path>
                    <path
                      d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"
                    ></path>
                    <path d="M9 7l1 -3h4l1 3"></path>
                  </svg>
                </button>
              </form>
            </td>
            <% } %>
          </tr>
          <% }) %>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Place this at bottom (after </div>) -->
<script>
  $(document).ready(function () {
    $(".select-permissions").select2({
      placeholder: "Select permissions",
      width: "100%",
      allowClear: true,
    });
  });
</script>
